name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornerstone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the tests on SQLite
        if: matrix.database == 'sqlite'
        run: python -m pytest -q
      - name: Run the tests on Postgres (the engine Neon runs)
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cornerstone_test
        run: python -m pytest -q

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t the-cornerstone .
      - name: Start the container and check /health
        run: |
          docker run -d --name cs -p 8000:8000 -e APP_ADMIN_EMAIL=admin@example.com -e "APP_ADMIN_PASSWORD=correct horse battery" the-cornerstone
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs cs
          exit 1
